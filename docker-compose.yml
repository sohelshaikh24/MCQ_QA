version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mcq-backend
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mcq-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000