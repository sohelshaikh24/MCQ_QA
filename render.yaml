services:
  - type: web
    name: mcq-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    autoDeploy: true
    # Render automatically detects the port from your Dockerfile CMD/EXPOSE
    # so you don’t need "ports:" here

  - type: web
    name: mcq-frontend
    env: docker
    dockerfilePath: Dockerfile.frontend
    plan: free
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        value: https://mcq-backend.onrender.com
